# Local development and self-hosted deployment.
#
# Development (just the database):
#   POSTGRES_PASSWORD='choose-something' docker compose up -d postgres
#   cd backend && mvn spring-boot:run
#   cd jobhunt && npm run dev
#
# Full stack in containers:
#   export POSTGRES_PASSWORD='...'
#   export JWT_SECRET="$(openssl rand -base64 48)"
#   docker compose up -d --build
#   open http://localhost:5173
#
# Nothing here ships a default credential: Compose refuses to start unless
# POSTGRES_PASSWORD and JWT_SECRET are provided.

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobhunt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobhunt}
      POSTGRES_USER: ${POSTGRES_USER:-jobhunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobhunt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunt} -d ${POSTGRES_DB:-jobhunt}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: jobhunt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobhunt}
      DB_USERNAME: ${POSTGRES_USER:-jobhunt}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - try openssl rand -base64 48}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      STORAGE_ROOT: /app/data/uploads
      # Optional. Without it the assistant reports itself as unavailable.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      # Uploaded documents must outlive the container.
      - jobhunt-uploads:/app/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./jobhunt
    container_name: jobhunt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  jobhunt-pgdata:
  jobhunt-uploads:
