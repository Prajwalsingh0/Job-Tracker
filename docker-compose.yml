# Local PostgreSQL for development.
#
# The password is intentionally NOT hardcoded - Docker Compose refuses to start unless
# POSTGRES_PASSWORD is set in your environment (or a local .env file, which is git-ignored).
#
#   POSTGRES_PASSWORD='choose-a-password' docker compose up -d
#   cd backend
#   export DB_USERNAME=jobhunt DB_PASSWORD='choose-a-password' JWT_SECRET="$(openssl rand -base64 48)"
#   mvn spring-boot:run

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobhunt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobhunt}
      POSTGRES_USER: ${POSTGRES_USER:-jobhunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see docker-compose.yml}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobhunt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunt} -d ${POSTGRES_DB:-jobhunt}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  jobhunt-pgdata:
