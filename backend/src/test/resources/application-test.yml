# Test profile: runs the full Spring context against an in-memory H2 database in
# PostgreSQL compatibility mode, so `mvn test` needs no external database.
#
# Flyway runs the same migration pipeline here as it does against PostgreSQL, using the
# vendor-specific folder db/migration/h2. Hibernate then validates the entities against
# the migrated schema, so a drift between the migrations and the entities fails the build.
spring:
  datasource:
    url: jdbc:h2:mem:jobhunt-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Ephemeral signing key generated fresh for every test run. No secret literal is
    # stored in the repository, and `mvn test` needs no JWT_SECRET environment variable.
    secret: ${random.uuid}${random.uuid}
    expiration-ms: 900000
    refresh-expiration-ms: 3600000
  security:
    secure-cookies: false
    login-rate-limit:
      max-attempts: 1000
      window-seconds: 60
  cors:
    allowed-origins: http://localhost:5173
