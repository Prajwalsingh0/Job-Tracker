server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: jobhunt-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobhunt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # MVP convenience: create/update the schema on boot. Switch to Flyway or
      # Liquibase migrations before running in a real production environment.
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    # Omit null fields so absent optional values arrive as `undefined` in the frontend.
    default-property-inclusion: non_null

app:
  jwt:
    # Override in any real deployment: JWT_SECRET must be at least 32 characters.
    secret: ${JWT_SECRET:jobhunt-development-only-secret-key-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Origins allowed to call the API from a browser (the Vite dev server by default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.jobhunt: INFO
