server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: jobhunt-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobhunt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # The schema is owned by versioned Flyway migrations under db/migration/{vendor}.
  # Hibernate never creates or alters tables; it only validates that the entities match.
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    # Omit null fields so absent optional values arrive as `undefined` in the frontend.
    default-property-inclusion: non_null

app:
  jwt:
    # Required. Supply JWT_SECRET as an environment variable; the server refuses to
    # start if it is missing or shorter than 32 characters (e.g. openssl rand -base64 48).
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  security:
    # Set to true when the API is served over HTTPS so refresh cookies are Secure-only.
    secure-cookies: ${SECURE_COOKIES:false}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:900}
  cors:
    # Origins allowed to call the API from a browser (the Vite dev server by default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.jobhunt: INFO
