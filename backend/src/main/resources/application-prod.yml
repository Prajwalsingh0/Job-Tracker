# Production profile.
#
# Deliberate differences from the default profile:
#   * Database credentials have NO default. The application refuses to start unless
#     DB_URL, DB_USERNAME and DB_PASSWORD are all supplied.
#   * JWT_SECRET has no default either.
#   * CORS_ALLOWED_ORIGINS has no default, so a misconfigured deployment fails closed
#     instead of silently allowing localhost.
#   * Refresh cookies are marked Secure, so they are only sent over HTTPS.
#
# Activate with:  --spring.profiles.active=prod

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  security:
    secure-cookies: true
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:900}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

logging:
  level:
    com.jobhunt: INFO
  # Never log request bodies or credentials at INFO and above.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
